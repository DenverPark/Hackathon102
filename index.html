<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원단 조합 테스트 서비스</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- 헤더 -->
    <header class="header">
      <h1>🧵 원단 조합 테스트 서비스</h1>
      <p class="subtitle">Supabase DB 기반 원단 6종 특성 분석 & 조합 호환성 테스트 가이드</p>
    </header>

    <!-- 스텝 인디케이터 -->
    <div class="step-indicator" id="step-indicator">
      <div class="step active" data-step="select"><span class="step-num">1</span><span class="step-label">원단 선택</span></div>
      <div class="step-line"></div>
      <div class="step" data-step="review"><span class="step-num">2</span><span class="step-label">선택 조회</span></div>
      <div class="step-line"></div>
      <div class="step" data-step="compat"><span class="step-num">3</span><span class="step-label">호환성 결과</span></div>
      <div class="step-line"></div>
      <div class="step" data-step="guide"><span class="step-num">4</span><span class="step-label">테스트 가이드</span></div>
      <div class="step-line"></div>
      <div class="step" data-step="action"><span class="step-num">5</span><span class="step-label">조치 추천</span></div>
    </div>

    <!-- ① 원단 선택 -->
    <section id="tab-select" class="tab-panel active">
      <div class="section-intro">
        <h2>보유 원단 선택</h2>
        <p>조합할 원단을 2개 이상 선택하세요. 각 원단의 '상세 정보' 버튼을 누르면 시험 및 물성 스펙을 확인할 수 있습니다.</p>
      </div>
      <div id="fabric-list" class="fabric-grid"></div>
    </section>

    <!-- ② 선택 조회 -->
    <section id="tab-review" class="tab-panel">
      <div id="selected-summary" class="selected-summary"></div>
      <div id="selected-fabrics" class="selected-list"></div>
      <div class="action-bar">
        <button class="btn btn-ghost" onclick="switchStep('select')">← 원단 다시 선택</button>
        <button id="btn-test" class="btn btn-primary" disabled>🔬 3단계 호환성 분석 진행</button>
      </div>
    </section>

    <!-- ③ 호환성 결과 -->
    <section id="tab-compat" class="tab-panel">
      <div id="compat-content"></div>
    </section>

    <!-- ④ 테스트 가이드 + 결과 입력 -->
    <section id="tab-guide" class="tab-panel">
      <div id="guide-content"></div>
    </section>

    <!-- ⑤ 조치 추천 -->
    <section id="tab-action" class="tab-panel">
      <div id="action-content"></div>
    </section>

    <!-- 플로팅 바 -->
    <div id="floating-bar" class="floating-bar hidden">
      <span><strong id="selected-count">0</strong>개 원단 선택됨</span>
      <button class="btn btn-small" onclick="switchStep('review')">선택 조회 및 분석 →</button>
    </div>

    <!-- 원단 상세 정보 모달 -->
    <div id="fabric-modal" class="modal hidden">
      <div class="modal-backdrop" onclick="closeFabricModal()"></div>
      <div class="modal-card">
        <div class="modal-header">
          <div id="modal-title-area">
            <h3 id="modal-title">원단 상세 정보</h3>
            <span id="modal-badge" class="badge"></span>
          </div>
          <button class="btn-close" onclick="closeFabricModal()">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
